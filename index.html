<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>DB PORTFOLIO — Base de Datos II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#05060d;
  --bg-2:#090c18;
  --panel:rgba(255,255,255,0.045);
  --panel-solid:#0d1120;
  --border:rgba(255,255,255,0.09);
  --border-glow:rgba(88,196,255,0.35);
  --cyan:#3fe4ff;
  --cyan-soft:#7df3ff;
  --purple:#a06bff;
  --blue:#5b7cff;
  --pink:#ff5fb0;
  --text:#e9edfb;
  --text-dim:#8b93b3;
  --text-dimmer:#5c6485;
  --green:#3ee897;
  --amber:#ffb84f;
  --red:#ff5c7a;
  --radius:16px;
  --radius-sm:10px;
  --shadow-glow:0 0 40px rgba(63,228,255,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(63,228,255,0.25);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(63,228,255,0.45);}

h1,h2,h3,h4,.font-display{font-family:'Chakra Petch',sans-serif;letter-spacing:0.01em;}
code,.mono{font-family:'JetBrains Mono',monospace;}

a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* ---------- background field ---------- */
#bgfx{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 900px 600px at 15% -5%, rgba(160,107,255,0.16), transparent 60%),
    radial-gradient(ellipse 900px 700px at 105% 10%, rgba(63,228,255,0.14), transparent 60%),
    radial-gradient(ellipse 800px 800px at 50% 120%, rgba(91,124,255,0.10), transparent 60%),
    var(--bg);
}
#bgfx::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, black 20%, transparent 75%);
}
.particle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle, rgba(63,228,255,0.9), rgba(63,228,255,0));
  filter:blur(0.3px);
  animation:drift linear infinite;
  opacity:0.55;
}
@keyframes drift{
  0%{transform:translateY(0) translateX(0);}
  50%{transform:translateY(-40px) translateX(12px);}
  100%{transform:translateY(0) translateX(0);}
}
.scanline{
  position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(63,228,255,0.5), transparent);
  animation:scan 6s linear infinite;
  opacity:0.35;
}
@keyframes scan{0%{transform:translateY(0);}100%{transform:translateY(100vh);}}

/* ---------- layout shell ---------- */
#app{position:relative;z-index:1;display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex-shrink:0;background:linear-gradient(180deg, rgba(13,17,32,0.9), rgba(9,12,24,0.9));
  border-right:1px solid var(--border);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;padding:20px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:width 0.25s ease, transform 0.25s ease;
  z-index:40;
}
.sidebar.collapsed{width:76px;}
.sidebar.collapsed .side-label,.sidebar.collapsed .brand-sub,.sidebar.collapsed .brand-name{display:none;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;}
.brand-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg, var(--cyan), var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 0 22px rgba(63,228,255,0.45);
}
.brand-icon-logo{background:#fff;padding:4px;box-shadow:0 0 22px rgba(63,228,255,0.3);}
.footer-logo{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;flex-shrink:0;}
.brand-name{font-family:'Chakra Petch';font-weight:700;font-size:15px;letter-spacing:0.04em;line-height:1.1;}
.brand-sub{font-size:10.5px;color:var(--text-dim);letter-spacing:0.06em;}

.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  color:var(--text-dim);font-size:13.5px;font-weight:500;margin-bottom:2px;
  border:1px solid transparent;transition:all 0.15s ease;position:relative;
}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(63,228,255,0.12), rgba(160,107,255,0.06));
  border-color:rgba(63,228,255,0.25);color:var(--cyan-soft);
}
.nav-item.active::before{
  content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;
  background:linear-gradient(180deg, var(--cyan), var(--purple));box-shadow:0 0 10px var(--cyan);
}
.nav-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
.nav-group-label{font-size:10px;letter-spacing:0.12em;color:var(--text-dimmer);padding:14px 12px 6px;font-weight:600;}
.collapse-btn{
  margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px;border-radius:10px;border:1px solid var(--border);color:var(--text-dim);
  background:rgba(255,255,255,0.02);font-size:12px;
}
.collapse-btn:hover{border-color:var(--border-glow);color:var(--cyan-soft);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px 26px;border-bottom:1px solid var(--border);
  background:rgba(5,6,13,0.72);backdrop-filter:blur(14px);
}
.hamburger{display:none;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);}
.search-wrap{position:relative;flex:1;max-width:460px;}
.search-input{
  width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);color:var(--text);font-size:13px;outline:none;transition:all .15s;
}
.search-input:focus{border-color:var(--border-glow);box-shadow:0 0 0 3px rgba(63,228,255,0.08);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:14px;}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel-solid);
  border:1px solid var(--border);border-radius:12px;max-height:360px;overflow-y:auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);display:none;z-index:50;
}
.search-results.show{display:block;}
.sr-item{padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:rgba(63,228,255,0.06);cursor:pointer;}
.sr-tag{font-size:9.5px;letter-spacing:0.07em;color:var(--cyan-soft);text-transform:uppercase;}
.sr-title{font-weight:600;margin-top:2px;}
.sr-sub{color:var(--text-dim);font-size:11.5px;margin-top:1px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.btn-ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:500;}
.btn-ghost:hover{color:var(--text);border-color:var(--border-glow);}

main.content{padding:28px 30px 90px;flex:1;}
@media(max-width:900px){
  main.content{padding:20px 16px 100px;}
}

/* ---------- generic ui ---------- */
.glass{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(10px);position:relative;
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg, rgba(63,228,255,0.18), transparent 40%, rgba(160,107,255,0.12));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.glow-card{transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.glow-card:hover{transform:translateY(-3px);border-color:rgba(63,228,255,0.4);box-shadow:0 14px 40px rgba(63,228,255,0.10);}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;}
.pill-cyan{background:rgba(63,228,255,0.12);color:var(--cyan-soft);border:1px solid rgba(63,228,255,0.3);}
.pill-purple{background:rgba(160,107,255,0.12);color:#c6a8ff;border:1px solid rgba(160,107,255,0.3);}
.pill-green{background:rgba(62,232,151,0.12);color:var(--green);border:1px solid rgba(62,232,151,0.3);}
.pill-amber{background:rgba(255,184,79,0.12);color:var(--amber);border:1px solid rgba(255,184,79,0.3);}
.pill-red{background:rgba(255,92,122,0.12);color:var(--red);border:1px solid rgba(255,92,122,0.3);}
.pill-dim{background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid var(--border);}

.btn-primary{
  padding:11px 20px;border-radius:11px;border:none;font-weight:600;font-size:13px;color:#04101a;
  background:linear-gradient(135deg, var(--cyan), var(--blue));box-shadow:0 8px 24px rgba(63,228,255,0.25);
  transition:transform .15s, box-shadow .15s;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(63,228,255,0.38);}
.btn-outline{
  padding:10px 18px;border-radius:11px;border:1px solid var(--border-glow);font-weight:600;font-size:13px;
  color:var(--cyan-soft);background:rgba(63,228,255,0.05);
}
.btn-outline:hover{background:rgba(63,228,255,0.1);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}

.progress-track{height:9px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;position:relative;}
.progress-fill{
  height:100%;border-radius:99px;background:linear-gradient(90deg, var(--cyan), var(--purple));
  transition:width 1s cubic-bezier(.16,1,.3,1);position:relative;
}
.progress-fill::after{
  content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  width:40%;animation:shine 2.2s ease-in-out infinite;
}
@keyframes shine{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}

.fade-up{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* hero */
.hero{
  position:relative;border-radius:22px;overflow:hidden;padding:56px 40px;
  background:radial-gradient(ellipse 700px 400px at 80% 0%, rgba(160,107,255,0.22), transparent 60%),
             radial-gradient(ellipse 700px 400px at 10% 100%, rgba(63,228,255,0.18), transparent 60%),
             linear-gradient(160deg, #0b0f1e, #0d1226 60%, #0a0e1c);
  border:1px solid var(--border);
}
.hero-eyebrow{font-size:11.5px;letter-spacing:0.14em;color:var(--cyan-soft);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:700;line-height:1.05;margin:0 0 16px;
  background:linear-gradient(135deg, #fff 20%, var(--cyan-soft) 60%, var(--purple) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{font-size:14.5px;color:var(--text-dim);font-family:'JetBrains Mono';letter-spacing:0.02em;margin-bottom:18px;}
.hero-blurb{max-width:620px;color:var(--text-dim);font-size:14.5px;line-height:1.65;margin-bottom:28px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;}
.hero-hud{position:absolute;right:36px;top:36px;width:150px;height:150px;opacity:0.5;pointer-events:none;}
@media(max-width:720px){.hero{padding:36px 20px;}.hero-hud{display:none;}}

.section-title{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:20px;font-weight:700;}
.section-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{padding:20px;}
.stat-num{font-family:'Chakra Petch';font-size:34px;font-weight:700;background:linear-gradient(135deg,var(--cyan-soft),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.stat-label{color:var(--text-dim);font-size:12.5px;margin-top:2px;}

.unit-card{padding:22px;cursor:pointer;}
.unit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.unit-num{font-family:'Chakra Petch';font-size:12px;color:var(--cyan-soft);letter-spacing:0.1em;}
.unit-title{font-size:17px;font-weight:700;margin-top:2px;}
.week-chip-row{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
.week-chip{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--text-dim);font-family:'JetBrains Mono';
}
.week-chip.completed{background:rgba(62,232,151,0.14);color:var(--green);border-color:rgba(62,232,151,0.4);}
.week-chip.in-progress{background:rgba(255,184,79,0.14);color:var(--amber);border-color:rgba(255,184,79,0.4);}

.week-card{padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;}
.week-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.week-num-badge{
  font-family:'Chakra Petch';font-size:11px;font-weight:700;color:var(--cyan-soft);letter-spacing:0.08em;
}
.week-title{font-size:15px;font-weight:700;margin-top:4px;}
.week-desc{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
.week-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}
.week-actions{display:flex;gap:8px;margin-top:6px;}

/* week detail */
.breadcrumb{font-size:12px;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:6px;}
.breadcrumb b{color:var(--text);}
.wd-header{padding:26px;margin-bottom:20px;}
.wd-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start;}
@media(max-width:980px){.wd-grid{grid-template-columns:1fr;}}
.detail-block{padding:20px;margin-bottom:16px;}
.detail-block h4{margin:0 0 10px;font-size:13px;letter-spacing:0.05em;color:var(--cyan-soft);display:flex;align-items:center;gap:8px;}
.detail-block ul{margin:0;padding-left:18px;color:var(--text-dim);font-size:13px;line-height:1.8;}
.detail-block p{color:var(--text-dim);font-size:13.5px;line-height:1.7;margin:0;}

.file-row{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,0.02);margin-bottom:8px;transition:all .15s;
}
.file-row:hover{border-color:var(--border-glow);background:rgba(63,228,255,0.04);}
.file-ic{width:36px;height:36px;border-radius:9px;background:rgba(63,228,255,0.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.file-info{flex:1;min-width:0;}
.file-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-sub{font-size:11px;color:var(--text-dim);margin-top:1px;}
.file-btns{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.02);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-dim);
}
.icon-btn:hover{border-color:var(--border-glow);color:var(--cyan-soft);}

.upload-zone{
  border:1.5px dashed var(--border-glow);border-radius:13px;padding:22px;text-align:center;color:var(--text-dim);
  font-size:12.5px;background:rgba(63,228,255,0.02);cursor:pointer;transition:all .15s;
}
.upload-zone:hover{background:rgba(63,228,255,0.06);}
.upload-zone.drag{background:rgba(63,228,255,0.1);border-color:var(--cyan);}

.comment-item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);margin-bottom:8px;font-size:12.5px;}
.comment-item .c-meta{color:var(--text-dimmer);font-size:10.5px;margin-top:4px;}
textarea.dark-input,input.dark-input,select.dark-input{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);
  color:var(--text);font-size:13px;outline:none;font-family:inherit;
}
textarea.dark-input:focus,input.dark-input:focus,select.dark-input:focus{border-color:var(--border-glow);}

/* profile */
.profile-card{padding:26px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
.avatar-ring{
  width:88px;height:88px;border-radius:20px;flex-shrink:0;
  background:conic-gradient(from 0deg, var(--cyan), var(--purple), var(--cyan));
  display:flex;align-items:center;justify-content:center;padding:3px;
}
.avatar-inner{width:100%;height:100%;border-radius:17px;background:#0a0e1c;display:flex;align-items:center;justify-content:center;font-size:30px;}
.profile-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;margin-top:14px;}
.pf-label{font-size:10px;letter-spacing:0.1em;color:var(--text-dimmer);margin-bottom:3px;}
.pf-val{font-size:13.5px;font-weight:600;}

/* modal / viewer */
.overlay{position:fixed;inset:0;background:rgba(3,4,9,0.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.viewer-panel{
  width:min(980px,96vw);max-height:92vh;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0b0f1e,#080b16);border:1px solid rgba(63,228,255,0.3);
  box-shadow:0 0 60px rgba(63,228,255,0.15), 0 30px 80px rgba(0,0,0,0.6);
}
.viewer-head{
  padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
  background:linear-gradient(90deg, rgba(63,228,255,0.08), transparent);
}
.viewer-tag{font-family:'Chakra Petch';font-size:11px;letter-spacing:0.12em;color:var(--cyan-soft);font-weight:700;}
.viewer-fname{font-size:13px;color:var(--text-dim);font-family:'JetBrains Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.viewer-body{flex:1;display:flex;overflow:hidden;min-height:380px;}
.viewer-main{flex:1;overflow:auto;padding:0;background:#05070f;display:flex;align-items:center;justify-content:center;position:relative;}
.viewer-side{width:220px;flex-shrink:0;border-left:1px solid var(--border);padding:16px;overflow-y:auto;background:rgba(255,255,255,0.015);}
.viewer-side .vs-row{margin-bottom:14px;}
.viewer-side .vs-label{font-size:9.5px;letter-spacing:0.1em;color:var(--text-dimmer);margin-bottom:3px;}
.viewer-side .vs-val{font-size:12px;font-weight:600;word-break:break-word;}
.viewer-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
@media(max-width:720px){.viewer-side{display:none;}.viewer-panel{width:100%;height:100%;max-height:100vh;border-radius:0;}}

.code-view{width:100%;height:100%;overflow:auto;padding:18px;font-family:'JetBrains Mono';font-size:12.5px;line-height:1.7;}
.code-line{display:flex;gap:14px;}
.code-ln{color:var(--text-dimmer);user-select:none;min-width:28px;text-align:right;}
.code-txt{white-space:pre-wrap;word-break:break-word;flex:1;}
.tok-kw{color:var(--cyan-soft);font-weight:700;}
.tok-str{color:var(--green);}
.tok-num{color:var(--amber);}
.tok-com{color:var(--text-dimmer);font-style:italic;}

table.csv-table{border-collapse:collapse;width:100%;font-size:12px;}
table.csv-table th,table.csv-table td{border:1px solid var(--border);padding:6px 10px;text-align:left;white-space:nowrap;}
table.csv-table th{background:rgba(63,228,255,0.08);color:var(--cyan-soft);position:sticky;top:0;}
table.csv-table tr:nth-child(even){background:rgba(255,255,255,0.02);}
.table-wrap{width:100%;height:100%;overflow:auto;padding:4px;}

/* chatbot */
.chat-fab{
  position:fixed;right:24px;bottom:24px;z-index:90;width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg, var(--cyan), var(--purple));border:none;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 8px 30px rgba(63,228,255,0.4);animation:floaty 3s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.chat-fab .ping{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--bg);}
.chat-panel{
  position:fixed;right:24px;bottom:100px;z-index:91;width:380px;max-width:92vw;height:540px;max-height:75vh;
  border-radius:18px;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#0b0f1e,#080b16);border:1px solid rgba(63,228,255,0.3);
  box-shadow:0 0 60px rgba(63,228,255,0.15), 0 30px 80px rgba(0,0,0,0.6);
}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(90deg, rgba(63,228,255,0.1), rgba(160,107,255,0.06));}
.chat-mascot{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.chat-title{font-family:'Chakra Petch';font-weight:700;font-size:13.5px;}
.chat-sub{font-size:10.5px;color:var(--text-dim);}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:85%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.55;}
.msg.bot{align-self:flex-start;background:rgba(63,228,255,0.08);border:1px solid rgba(63,228,255,0.2);border-bottom-left-radius:4px;}
.msg.user{align-self:flex-end;background:rgba(160,107,255,0.14);border:1px solid rgba(160,107,255,0.25);border-bottom-right-radius:4px;}
.chat-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
.chat-chip{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.03);font-size:10.5px;color:var(--text-dim);}
.chat-chip:hover{border-color:var(--border-glow);color:var(--cyan-soft);}
.chat-ctx{margin:0 14px 8px;padding:7px 10px;border-radius:9px;background:rgba(255,184,79,0.08);border:1px solid rgba(255,184,79,0.25);font-size:11px;color:var(--amber);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.chat-input-row input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);font-size:12.5px;outline:none;}
.chat-input-row input:focus{border-color:var(--border-glow);}
.chat-send{width:38px;height:38px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#04101a;font-size:15px;flex-shrink:0;}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan-soft);margin-right:3px;animation:blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{padding:11px 16px;border-radius:11px;background:var(--panel-solid);border:1px solid var(--border-glow);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,0.4);animation:fadeUp .3s ease;}

footer.site-footer{border-top:1px solid var(--border);padding:32px 30px;margin-top:20px;color:var(--text-dim);font-size:12.5px;}
.footer-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);width:250px;box-shadow:0 0 40px rgba(0,0,0,0.6);}
  .sidebar.mobile-open{transform:translateX(0);}
  .hamburger{display:flex;}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:39;display:none;}
  .sidebar-backdrop.show{display:block;}
}
.empty-state{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px;}
.hidden{display:none !important;}
</style>

/* ---------------- Utilidades ---------------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/(1024*1024)).toFixed(2)+" MB";
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function getExt(name){ return (name.split('.').pop()||'').toLowerCase(); }
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}
function computeProgress(){
  const total = 16;
  let completed = 0;
  for(let i=1;i<=16;i++) if(state.weekStatus[i]==='completed') completed++;
  const percent = Math.round((completed/total)*100);
  const byUnit = UNITS.map(u=>{
    const [a,b] = u.range;
    let c=0, n=0;
    for(let i=a;i<=b;i++){ n++; if(state.weekStatus[i]==='completed') c++; }
    return {unit:u, percent:Math.round((c/n)*100)};
  });
  const totalFiles = Object.values(state.files).reduce((s,arr)=>s+arr.length,0);
  return {percent, byUnit, totalFiles, completedWeeks:completed};
}

/* ---------------- Persistencia (window.storage) ---------------- */
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}
async function saveState(){
  if(!window.storage) return;
  try{
    await window.storage.set('db2-portfolio-state', JSON.stringify(state), false);
  }catch(e){
    console.warn('No se pudo guardar el estado (posiblemente por tamaño de archivos adjuntos).', e);
    toast('⚠️ No se pudo guardar (el portafolio superó el espacio disponible). Elimina algún archivo pesado.');
  }
}
async function loadState(){
  if(!window.storage){ return; }
  try{
    const res = await window.storage.get('db2-portfolio-state', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state = Object.assign(state, saved);
      for(let i=1;i<=16;i++){
        if(!state.weekStatus[i]) state.weekStatus[i]='pending';
        if(!state.files[i]) state.files[i]=[];
        if(!state.comments[i]) state.comments[i]=[];
      }
    }
  }catch(e){ /* no hay datos previos */ }
}
async function resetAllData(){
  state = {
    profile:{name:"Fernando Josué Herrera Bastidas",career:"Ingeniería de Sistemas",course:"Base de Datos II",university:"Universidad Peruana Los Andes",teacher:"Ing. Docente del curso",cycle:"2026 - II"},
    weekStatus:{}, files:{}, comments:{}
  };
  for(let i=1;i<=16;i++){ state.weekStatus[i]='pending'; state.files[i]=[]; state.comments[i]=[]; }
  try{ if(window.storage) await window.storage.delete('db2-portfolio-state', false); }catch(e){}
  toast('Datos del portafolio reiniciados.');
  render();
}

async function sendChat(text){
  if(!text || !text.trim()) return;
  appendChatMsg('user', text.trim());
  ui.chatBusy = true;
  renderChat();

  const ctx = ui.chatContext;
  let systemPrompt = `Eres DB-AI (también llamada DB-CHAN), la mascota asistente virtual de un portafolio universitario de Base de Datos II. Tu tono es cercano, claro y motivador, con un toque de personalidad "anime-tech" pero SIEMPRE priorizando la precisión técnica. Ayudas con: SQL, MySQL, SQL Server, PostgreSQL, modelado entidad-relación, normalización, SELECT/INSERT/UPDATE/DELETE, JOIN, GROUP BY/HAVING, subconsultas, procedimientos almacenados, triggers, índices, claves primarias y foráneas, transacciones y seguridad de bases de datos. Responde en español, de forma concisa (máximo ~180 palabras salvo que se pida más detalle), usando bloques de código para SQL cuando aplique. Si te dan el contenido de un archivo, básate en él para responder.`;

  let userContent = text.trim();
  if(ctx && ctx.textContent){
    userContent = `Archivo de referencia: "${ctx.name}"\n\nContenido del archivo:\n${ctx.textContent.slice(0,4000)}\n\nPregunta del estudiante: ${text.trim()}`;
  } else if(ctx && !ctx.textContent){
    userContent = `El estudiante hace referencia al archivo "${ctx.name}" (tipo ${ctx.ext}), cuyo contenido binario no puede leerse directamente como texto. Responde de forma general y pide que describa el contenido si necesitas más detalle.\n\nPregunta del estudiante: ${text.trim()}`;
  }

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{role:"user", content: userContent}]
      })
    });
    const data = await response.json();
    let reply = "";
    if(data && data.content){
      reply = data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
    }
    if(!reply) reply = "No pude generar una respuesta en este momento. Intenta reformular tu pregunta.";
    ui.chatBusy = false;
    appendChatMsg('bot', reply);
    renderChat();
  }catch(e){
    ui.chatBusy = false;
    appendChatMsg('bot', "⚠️ No pude conectarme al servicio de IA en este momento. Revisa tu conexión e inténtalo de nuevo.");
    renderChat();
  }
}

/* ---------------- Subida y procesamiento de archivos ---------------- */
const MAX_FILE_BYTES = 2.5*1024*1024; // límite prudente: todo el estado (incluidos archivos en base64) comparte una sola clave de almacenamiento con tope de 5MB
function handleFiles(weekId, fileList){
  const allowed = ['pdf','doc','docx','ppt','pptx','xls','xlsx','csv','txt','sql','jpg','jpeg','png'];
  Array.from(fileList).forEach(rawFile=>{
    const ext = getExt(rawFile.name);
    if(!allowed.includes(ext)){
      toast(`Formato .${ext} no permitido.`);
      return;
    }
    if(rawFile.size > MAX_FILE_BYTES){
      toast(`⚠️ "${rawFile.name}" es muy pesado (${fmtSize(rawFile.size)}). Máximo recomendado: ${fmtSize(MAX_FILE_BYTES)}.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const fileObj = {
        id: uid(), name: rawFile.name, ext, size: rawFile.size,
        date: new Date().toISOString(), dataUrl, weekId,
        textContent: null,
      };
      if(TEXT_EXT.includes(ext)){
        const tReader = new FileReader();
        tReader.onload = ()=>{
          fileObj.textContent = tReader.result;
          state.files[weekId].push(fileObj);
          finishUpload(weekId, rawFile.name);
        };
        tReader.readAsText(rawFile);
      } else {
        state.files[weekId].push(fileObj);
        finishUpload(weekId, rawFile.name);
      }
    };
    reader.readAsDataURL(rawFile);
  });
}
function finishUpload(weekId, name){
  toast(`✅ "${name}" subido a la semana ${String(weekId).padStart(2,'0')}.`);
  scheduleSave();
  render();
}

function xlsxRenderTrigger(file){
  setTimeout(()=>{
    try{
      const holder = document.getElementById('xlsxHolder-'+file.id);
      if(!holder || typeof XLSX==='undefined') return;
      const base64 = file.dataUrl.split(',')[1];
      const wb = XLSX.read(base64, {type:'base64'});
      const sheetName = wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const htmlTable = XLSX.utils.sheet_to_html(sheet, {id:'xlsxTable'});
      let tabs = wb.SheetNames.length>1 ? `<div style="display:flex;gap:6px;padding:10px 10px 0;flex-wrap:wrap;">${wb.SheetNames.map((n,i)=>`<span class="pill ${i===0?'pill-cyan':'pill-dim'}">${escapeHtml(n)}</span>`).join('')}</div>` : '';
      holder.innerHTML = tabs + `<div style="padding:10px;overflow:auto;">` + htmlTable.replace('<table','<table class="csv-table"') + `</div>`;
    }catch(e){
      const holder = document.getElementById('xlsxHolder-'+file.id);
      if(holder) holder.innerHTML = `<div class="empty-state">No se pudo generar la vista previa de este Excel. Puedes descargarlo.</div>`;
    }
  }, 30);
  return '';
}

function docxRenderTrigger(file){
  setTimeout(async ()=>{
    try{
      const holder = document.getElementById('docxHolder-'+file.id);
      if(!holder || typeof mammoth==='undefined') return;
      const base64 = file.dataUrl.split(',')[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const result = await mammoth.convertToHtml({arrayBuffer: bytes.buffer});
      holder.innerHTML = `<div style="max-width:640px;line-height:1.7;font-size:13.5px;">${result.value}</div>`;
    }catch(e){
      const holder = document.getElementById('docxHolder-'+file.id);
      if(holder) holder.innerHTML = `<div class="empty-state">No se pudo generar la vista previa de este documento Word. Puedes descargarlo.</div>`;
    }
  }, 30);
  return '';
}

function plainCodeLines(text){
  const lines = text.split('\n');
  return lines.map((l,i)=>`<div class="code-line"><span class="code-ln">${i+1}</span><span class="code-txt">${escapeHtml(l)}</span></div>`).join('');
}

const SQL_KEYWORDS = ["SELECT","FROM","WHERE","INSERT","INTO","UPDATE","DELETE","JOIN","INNER","LEFT","RIGHT","OUTER","ON","GROUP","BY","ORDER","HAVING","CREATE","TABLE","ALTER","DROP","PRIMARY","KEY","FOREIGN","REFERENCES","VALUES","SET","AND","OR","NOT","NULL","AS","DISTINCT","LIMIT","PROCEDURE","FUNCTION","TRIGGER","BEGIN","END","DECLARE","IF","ELSE","RETURN","COMMIT","ROLLBACK","TRANSACTION","GRANT","REVOKE","INDEX","VIEW","UNION","EXISTS","IN","BETWEEN","LIKE","CASE","WHEN","THEN","DEFAULT","CONSTRAINT","CHECK","INT","VARCHAR","DATE","DATETIME","DECIMAL","FLOAT","BOOLEAN","EXEC","USE","DATABASE"];
function sqlHighlight(text){
  const lines = text.split('\n');
  return lines.map((l,i)=>{
    let esc = escapeHtml(l);
    esc = esc.replace(/(--.*$)/g, '<span class="tok-com">$1</span>');
    esc = esc.replace(/('([^'\\]|\\.)*')/g, '<span class="tok-str">$1</span>');
    esc = esc.replace(/\b(\d+(\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    const kwPattern = new RegExp('\\b('+SQL_KEYWORDS.join('|')+')\\b','gi');
    esc = esc.replace(kwPattern, '<span class="tok-kw">$1</span>');
    return `<div class="code-line"><span class="code-ln">${i+1}</span><span class="code-txt">${esc}</span></div>`;
  }).join('');
}

function csvToTable(text){
  const rows = text.split(/\r?\n/).filter(r=>r.length>0).map(r=>r.split(','));
  if(rows.length===0) return '<div class="empty-state">Archivo CSV vacío.</div>';
  const [head, ...body] = rows;
  return `<table class="csv-table"><thead><tr>${head.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

  for(let w=1; w<=16; w++){
    const wk = WEEKS[w];
    const hay = (wk.title+' '+wk.desc+' '+wk.objectives.join(' ')+' '+wk.activities.join(' ')).toLowerCase();
    if(hay.includes(q)){
      results.push({tag:`Semana ${String(w).padStart(2,'0')} · Unidad ${wk.unit}`, title:wk.title, sub:wk.desc, action:`goto:week:${w}`});
    }
  }
  for(let w=1; w<=16; w++){
    state.files[w].forEach(f=>{
      const hay = (f.name+' '+(f.textContent||'')).toLowerCase();
      if(hay.includes(q)){
        results.push({tag:`Archivo · Semana ${String(w).padStart(2,'0')}`, title:f.name, sub:`${f.ext.toUpperCase()} · ${fmtSize(f.size)}`, action:`viewFile:${w}:${f.id}`});
      }
    });
  }
  PROJECTS.forEach(p=>{
    if((p.name+' '+p.desc).toLowerCase().includes(q)){
      results.push({tag:'Proyecto', title:p.name, sub:p.desc, action:`goto:week:${p.weekRef}`});
    }
  });

  if(results.length===0){
    box.innerHTML = `<div class="sr-item" style="cursor:default;">Sin resultados para "${escapeHtml(query)}".</div>`;
  } else {
    box.innerHTML = results.slice(0,12).map(r=>`
      <div class="sr-item" data-searchgo="${r.action}">
        <div class="sr-tag">${escapeHtml(r.tag)}</div>
        <div class="sr-title">${escapeHtml(r.title)}</div>
        <div class="sr-sub">${escapeHtml(r.sub||'').slice(0,80)}</div>
      </div>`).join('');
  }
  box.classList.add('show');
}

/* ---------------- Delegación de eventos ---------------- */
document.addEventListener('click', (e)=>{
  const sr = e.target.closest('[data-searchgo]');
  if(sr){
    const [act, a, b] = sr.dataset.searchgo.split(':');
    document.getElementById('searchResults').classList.remove('show');
    if(act==='goto'){ ui.view=a; ui.currentWeek=Number(b); render(); }
    if(act==='viewFile'){
      const w = Number(a), fid=b;
      const f = state.files[w].find(x=>x.id===fid);
      if(f){ ui.viewerFile={file:f, weekId:w}; renderViewer(); }
    }
    return;
  }
  if(!e.target.closest('.search-wrap')){
    const box = document.getElementById('searchResults');
    if(box) box.classList.remove('show');
  }

  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  switch(action){
    case 'goto':
      ui.view = t.dataset.view;
      if(t.dataset.week) ui.currentWeek = Number(t.dataset.week);
      ui.mobileOpen = false;
      window.scrollTo({top:0,behavior:'smooth'});
      render();
      break;
    case 'toggleSidebar': ui.sidebarCollapsed = !ui.sidebarCollapsed; render(); break;
    case 'toggleMobile': ui.mobileOpen = !ui.mobileOpen; render(); break;
    case 'closeMobile': ui.mobileOpen = false; render(); break;
    case 'cycleStatus':{
      const w = Number(t.dataset.week);
      state.weekStatus[w] = STATUS_CYCLE[state.weekStatus[w]];
      scheduleSave(); render();
      break;}
    case 'triggerUpload':{
      const w = t.dataset.week;
      const input = document.getElementById('fileInput-'+w);
      if(input) input.click();
      break;}
    case 'viewFile':{
      const w = Number(t.dataset.week), fid = t.dataset.file;
      const f = state.files[w].find(x=>x.id===fid);
      if(f){ ui.viewerFile = {file:f, weekId:w}; renderViewer(); }
      break;}
    case 'closeViewer': ui.viewerFile=null; renderViewer(); break;
    case 'closeViewerBg': if(e.target.id==='viewerOverlay'){ ui.viewerFile=null; renderViewer(); } break;
    case 'fullscreenViewer':{
      const el = document.querySelector('.viewer-panel');
      if(el && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      break;}
    case 'deleteFile':{
      const w = Number(t.dataset.week), fid = t.dataset.file;
      state.files[w] = state.files[w].filter(x=>x.id!==fid);
      scheduleSave(); toast('Archivo eliminado.'); render();
      break;}
    case 'copyFileContent':{
      const w = Number(t.dataset.week), fid = t.dataset.file;
      const f = state.files[w].find(x=>x.id===fid);
      if(f && f.textContent){
        navigator.clipboard.writeText(f.textContent).then(()=>toast('Contenido copiado.')).catch(()=>toast('No se pudo copiar.'));
      }
      break;}
    case 'setFilesFilter': ui.filesFilter = t.dataset.filter; render(); break;
    case 'addComment':{
      const w = Number(t.dataset.week);
      const inp = document.getElementById('newCommentInput');
      if(inp && inp.value.trim()){
        state.comments[w].push({text:inp.value.trim(), date:new Date().toISOString()});
        scheduleSave(); render();
      }
      break;}
    case 'confirmReset':
      if(confirm('¿Seguro que deseas borrar todo el progreso, comentarios y archivos del portafolio? Esta acción no se puede deshacer.')){
        resetAllData();
      }
      break;
    /* chat */
    case 'toggleChat': ui.chatOpen = !ui.chatOpen; renderChat(); break;
    case 'openChat': ui.chatOpen = true; renderChat(); break;
    case 'clearChatContext': ui.chatContext = null; renderChat(); break;
    case 'quickChat':{
      const prompt = t.dataset.prompt;
      sendChat(prompt);
      break;}
    case 'sendChat':{
      const inp = document.getElementById('chatInput');
      if(inp && inp.value.trim()){ const v=inp.value; inp.value=''; sendChat(v); }
      break;}
    case 'askAboutWeek':{
      const w = Number(t.dataset.week);
      ui.chatContext = {weekId:w, fileId:null, name:`Semana ${String(w).padStart(2,'0')} — ${WEEKS[w].title}`, textContent:`${WEEKS[w].title}. ${WEEKS[w].desc} Objetivos: ${WEEKS[w].objectives.join('; ')}`, ext:'semana'};
      ui.chatOpen = true; renderChat();
      break;}
    case 'askAboutFile':{
      const w = Number(t.dataset.week), fid = t.dataset.file;
      const f = state.files[w].find(x=>x.id===fid);
      if(f){
        ui.chatContext = {weekId:w, fileId:fid, name:f.name, textContent:f.textContent, ext:f.ext};
        ui.chatOpen = true; renderChat();
      }
      break;}
  }
});

document.addEventListener('input', (e)=>{
  if(e.target.id==='globalSearch') runSearch(e.target.value);
});

document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.id==='chatInput'){
    const v = e.target.value;
    if(v.trim()){ e.target.value=''; sendChat(v); }
  }
  if(e.key==='Escape'){
    if(ui.viewerFile){ ui.viewerFile=null; renderViewer(); }
  }
});

document.addEventListener('change', (e)=>{
  if(e.target.matches('input[type="file"]')){
    const weekId = Number(e.target.dataset.week);
    if(e.target.files && e.target.files.length){
      handleFiles(weekId, e.target.files);
    }
    e.target.value = '';
  }
});

document.addEventListener('blur', (e)=>{
  if(e.target.matches('[data-action="editProfile"]')){
    const field = e.target.dataset.field;
    state.profile[field] = e.target.textContent.trim();
    scheduleSave();
  }
}, true);

/* drag & drop en zonas de subida */
document.addEventListener('dragover', (e)=>{
  const zone = e.target.closest('.upload-zone');
  if(zone){ e.preventDefault(); zone.classList.add('drag'); }
});
document.addEventListener('dragleave', (e)=>{
  const zone = e.target.closest('.upload-zone');
  if(zone) zone.classList.remove('drag');
});
document.addEventListener('drop', (e)=>{
  const zone = e.target.closest('.upload-zone');
  if(zone){
    e.preventDefault(); zone.classList.remove('drag');
    const weekId = Number(zone.dataset.week || zone.id.replace('dropZone-',''));
    if(e.dataTransfer.files && e.dataTransfer.files.length){
      handleFiles(weekId, e.dataTransfer.files);
    }
  }
});

/* ---------------- Vista: Archivos (galería) ---------------- */
function viewFiles(){
  let all = [];
  for(let w=1; w<=16; w++){
    state.files[w].forEach(f=> all.push({...f, weekId:w}));
  }
  const filter = ui.filesFilter;
  let filtered = all;
  if(filter==='images') filtered = all.filter(f=>IMG_EXT.includes(f.ext));
  else if(filter==='docs') filtered = all.filter(f=>!IMG_EXT.includes(f.ext));
  filtered.sort((a,b)=> new Date(b.date)-new Date(a.date));

  const tabs = [['all','Todos'],['docs','Documentos'],['images','Galería de imágenes']];
  return `
  <div class="section-title">📁 Archivos del portafolio</div>
  <div class="section-sub">Todas las evidencias subidas a lo largo del curso (${all.length} en total).</div>

  </div>
  ${filtered.length===0 ? `<div class="empty-state glass" style="padding:50px;">Aún no has subido archivos. Ve a una semana y usa "Subir archivo".</div>` : ''}

}
